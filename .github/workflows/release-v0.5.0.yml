# One-time v0.5.0 publication authorized by the repository owner.
# Remove this workflow after the release and both downloads are verified.
name: Publish Afterhours v0.5.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.5.0.yml]
permissions:
  contents: read
concurrency:
  group: afterhours-release-v0.5.0
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 7cd2f79771bd5e59d885224be9fc050998ecc89c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      - run: npm test
      - run: npm run build:service
      - run: python scripts/package-prototype.py
      - run: npm run build:uno
      - run: python scripts/package-wasm.py
      - name: Prepare release checksums and notes
        working-directory: release
        run: |
          cp ../RELEASE-NOTES.txt .
          sha256sum Afterhours.html afterhours-uno-wasm.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-v0.5.0
          path: |
            release/Afterhours.html
            release/afterhours-uno-wasm.zip
            release/SHA256SUMS.txt
            release/RELEASE-NOTES.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: 7cd2f79771bd5e59d885224be9fc050998ecc89c
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-v0.5.0
          path: release
      - name: Create or resume the version-specific draft
        run: |
          if gh release view v0.5.0 --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          release = json.load(open('existing-release.json'))
          assert release['isDraft'], 'v0.5.0 is already published; do not replace it.'
          assert release['targetCommitish'] == os.environ['RELEASE_COMMIT'], 'Draft points to a different commit.'
          PY
          else
            gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
            python3 - <<'PY'
          import json
          assert not any(r['tag_name'] == 'v0.5.0' for r in json.load(open('releases.json'))), 'Existing release could not be inspected.'
          PY
            gh release create v0.5.0 --target "$RELEASE_COMMIT" --title "Afterhours 0.5 — playable preview" --notes-file release/RELEASE-NOTES.txt --draft --prerelease
          fi
      - name: Upload and verify downloads before publication
        run: |
          gh release upload v0.5.0 release/Afterhours.html release/afterhours-uno-wasm.zip release/SHA256SUMS.txt --clobber
          gh api "repos/$GH_REPO/releases/418770675" > uploaded-release.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          release = json.load(open('uploaded-release.json'))
          assets = {asset['name']: asset for asset in release['assets']}
          for name in ['Afterhours.html', 'afterhours-uno-wasm.zip', 'SHA256SUMS.txt']:
              content = (pathlib.Path('release') / name).read_bytes()
              asset = assets[name]
              assert asset['state'] == 'uploaded'
              assert asset['size'] == len(content)
              assert asset['digest'] == 'sha256:' + hashlib.sha256(content).hexdigest()
          PY
          gh release edit v0.5.0 --draft=false --prerelease
